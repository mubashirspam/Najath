version: 0.0.1

resolution: workspace
publish_to: 'none'

environment:
  sdk: ^3.12.2
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.0.0
  dio: ^5.11.0
  najath_core:
    path: ../core
  najath_network:
    path: ../network
  najath_local_db:
