include: package:very_good_analysis/analysis_options.yaml

analyzer:
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "**/*.gr.dart"
    # flutter gen-l10n output — regenerated by `melos run gen`, not hand-edited.
    - "**/l10n/generated/**"
    - "**/generated_plugin_registrant.dart"
    # Both forms: `**/build/**` misses a build/ at the analysis root,
    # which is where the vendored Firebase examples land.
    - "build/**"
    - "**/build/**"
  errors:
    invalid_annotation_target: ignore

linter:
  rules:
    # The repo is private and every file would otherwise need a licence header.
    public_member_api_docs: false
    lines_longer_than_80_chars: false
    # `flutter pub add` appends rather than inserts; not worth the churn.
    sort_pub_dependencies: false
    # Dart's own style guide prefers relative imports inside a package's lib/,
    # and it keeps a file's own-package imports visually distinct from the
    # cross-package ones that actually cross a boundary here.
    always_use_package_imports: false
    prefer_relative_imports: true
    # Repositories and data sources take public named parameters and assign
    # them to private fields. Dart forbids a private named parameter, so the
    # initializing formal this lint asks for would strip the argument labels.
    prefer_initializing_formals: false
