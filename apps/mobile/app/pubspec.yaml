name: najath
description: "Najath Quran Academy"
publish_to: 'none'
resolution: workspace
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  cached_network_image: ^3.4.1
  collection: ^1.19.1
  connectivity_plus: ^7.3.1
  dio: ^5.11.0
  drift: ^2.34.3
  drift_flutter: ^0.3.1
  firebase_core: ^4.13.0
  firebase_crashlytics: ^5.2.7
  firebase_messaging: ^16.5.0
  fl_chart: ^1.2.0
  flutter:
    sdk: flutter
  flutter_image_compress: ^2.5.1
  flutter_local_notifications: ^22.3.0
  flutter_riverpod: ^3.0.0
  flutter_secure_storage: ^10.3.1
  flutter_svg: ^2.3.0
  freezed_annotation: ^3.1.0
  go_router: ^17.5.0
  google_fonts: ^8.2.1
  image_picker: ^1.2.3
  intl: ^0.20.3
  json_annotation: ^4.12.0
  path: ^1.9.1
  path_provider: ^2.1.6
  pdfx: ^2.9.2
  permission_handler: ^13.0.1
  printing: ^5.14.3
  retrofit: ^4.10.0
  riverpod_annotation: ^4.0.0
  share_plus: ^13.3.0
  shared_preferences: ^2.5.5
  shimmer: ^3.0.0
  sqlite3_flutter_libs: ^0.6.0+eol
  url_launcher: ^6.3.2
  uuid: ^4.6.0
  workmanager: ^0.10.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  riverpod_generator: ^4.0.4
  freezed: ^3.2.0
  json_serializable: ^6.14.1
  retrofit_generator: ^10.2.8
  drift_dev: ^2.34.0
  mocktail: ^1.0.5
  flutter_native_splash: ^2.4.8
  very_good_analysis: ^10.3.0
  flutter_launcher_icons: ^0.14.4
  patrol: ^4.9.0
  flutter_flavorizr: ^2.5.0

flutter:
  uses-material-design: true

  assets:
    - assets/db/
    - assets/images/

  # KFGQPC Uthmanic Script HAFS is not redistributable through this repo, so it
  # is fetched at setup time (see assets/fonts/README.md). Uncomment once
  # assets/fonts/UthmanicHafs.ttf is in place — Flutter fails the asset bundling
  # step if a registered font file is missing.
  # fonts:
  #   - family: UthmanicHafs
  #     fonts:
  #       - asset: assets/fonts/UthmanicHafs.ttf
