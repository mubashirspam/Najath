name: db

# Migrations are applied by CI only. Developers run `db:generate` locally and
# commit the SQL + journal; nobody points `db:migrate` at a shared database from
# their own machine.
#
# Databases (two, not three):
#
#   dev + staging  →  one shared Neon branch, GitHub environment `dev`
#   main           →  its own Neon branch,    GitHub environment `production`
#
# Every PR touching packages/db additionally gets a throwaway Neon branch forked
# from whichever of those two its base branch targets, so a migration is proven
# against production-shaped data before it reaches production.

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]
    paths:
      - "packages/db/**"
      - ".github/workflows/db.yml"
  push:
    branches: [dev, staging, main]
    paths:
      - "packages/db/**"
      - ".github/workflows/db.yml"

concurrency:
  group: db-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}

jobs:
  # ---------------------------------------------------------------- preview --
  preview:
    name: migrate preview branch
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Pick the Neon parent for this PR's base branch
        id: parent
        run: |
          case "${{ github.base_ref }}" in
            main)       parent=production ;;
            *)          parent=dev ;;
          esac
          echo "name=${parent}" >> "$GITHUB_OUTPUT"

      - name: Create Neon branch
        id: branch
        uses: neondatabase/create-branch-action@v6
        with:
          project_id: ${{ env.NEON_PROJECT_ID }}
          branch_name: preview/pr-${{ github.event.number }}
          parent: ${{ steps.parent.outputs.name }}
          api_key: ${{ secrets.NEON_API_KEY }}

      - name: Verify committed migrations match the schema
        # Fails if someone edited src/schema without running db:generate.
        run: |
          pnpm --filter @najath/db db:generate
          if ! git diff --quiet -- packages/db/migrations; then
            echo "::error::packages/db/migrations is out of date. Run 'pnpm --filter @najath/db db:generate' and commit the result."
            git --no-pager diff --stat -- packages/db/migrations
            exit 1
          fi
        env:
          DATABASE_URL: ${{ steps.branch.outputs.db_url_pooled }}

      - name: Apply migrations
        run: pnpm --filter @najath/db db:migrate
        env:
          DATABASE_URL: ${{ steps.branch.outputs.db_url }}

      - name: Comment the preview branch on the PR
        uses: thollander/actions-comment-pull-request@v3
        with:
          comment-tag: neon-preview
          message: |
            **Neon preview branch** `preview/pr-${{ github.event.number }}`
            (forked from `${{ steps.parent.outputs.name }}`) is up to date with
            this PR's migrations. It is deleted when the PR closes.

  # ----------------------------------------------------------------- cleanup --
  cleanup:
    name: delete preview branch
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: neondatabase/delete-branch-action@v3
        with:
          project_id: ${{ env.NEON_PROJECT_ID }}
          branch: preview/pr-${{ github.event.number }}
          api_key: ${{ secrets.NEON_API_KEY }}

  # ------------------------------------------------------------------ deploy --
  target:
    name: resolve target environment
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.map.outputs.environment }}
    steps:
      - id: map
        run: |
          case "${GITHUB_REF_NAME}" in
            main)
              env_name=production ;;
            dev|staging)
              # Deliberately the same database. A push to staging after the
              # same migration already landed on dev is a no-op — Drizzle skips
              # anything already in the journal table.
              env_name=dev ;;
            *)
              echo "::error::unexpected branch ${GITHUB_REF_NAME}"; exit 1 ;;
          esac
          echo "environment=${env_name}" >> "$GITHUB_OUTPUT"

  migrate:
    name: migrate ${{ needs.target.outputs.environment }}
    needs: target
    runs-on: ubuntu-latest
    environment: ${{ needs.target.outputs.environment }}
    concurrency:
      # Never two migrations against the same database at once.
      group: db-migrate-${{ needs.target.outputs.environment }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Apply migrations
        run: pnpm --filter @najath/db db:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
