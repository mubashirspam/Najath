name: ci

on:
  pull_request:
  push:
    branches: [dev, staging, production]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: web (lint · typecheck · build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm exec prettier --check "**/*.{ts,tsx,md,json,yaml,yml}"

      # One turbo invocation so the task graph is shared and `build` reuses
      # whatever `typecheck` already produced.
      - name: Lint, typecheck, build
        run: pnpm exec turbo run lint typecheck build
        env:
          # Nothing at build time talks to Postgres, but @najath/db throws at
          # import if the variable is absent.
          DATABASE_URL: postgresql://ci:ci@localhost:5432/najath_erp
          BETTER_AUTH_SECRET: ci-placeholder-secret-not-used-at-build-time
          BETTER_AUTH_URL: http://localhost:3000

  mobile:
    name: mobile (analyze · test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.4
          cache: true

      # Resolves the whole pub workspace in one go; melos is a dev_dependency
      # of the workspace root, so no global activation is needed.
      - run: flutter pub get

      - run: dart run melos run analyze

      - run: dart run melos run test

  mobile-build:
    name: mobile (android build)
    # Gradle is slow and adds little on every feature push; run it where it
    # protects a shared branch.
    if: github.event_name == 'push' || github.base_ref == 'production'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile/app
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # android/app/build.gradle.kts pins compileSdk 37.1. Install it explicitly
      # rather than relying on the runner image happening to carry it.
      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-37.1"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.4
          cache: true

      - run: flutter pub get

      - name: Pick the flavor for this branch
        id: flavor
        working-directory: apps/mobile
        run: |
          case "${GITHUB_REF_NAME}" in
            production) flavor=prod ;;
            staging)    flavor=staging ;;
            *)          flavor=dev ;;
          esac
          echo "name=${flavor}" >> "$GITHUB_OUTPUT"
          # config/*.json is gitignored; CI builds from the committed examples.
          cp "config/${flavor}.example.json" "config/${flavor}.json"

      - name: Build APK
        run: |
          flutter build apk --debug \
            --flavor "${{ steps.flavor.outputs.name }}" \
            --dart-define-from-file="../config/${{ steps.flavor.outputs.name }}.json"
